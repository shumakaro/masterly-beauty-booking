root /usr/share/nginx/html;
index index.html;
server_tokens off;
client_max_body_size 64k;
resolver 127.0.0.11 valid=10s ipv6=off;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

location ~ ^/api/v1/auth/(token|register|refresh)$ {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/includes/proxy.conf;
}
location /api/ {
    limit_req zone=api burst=50 nodelay;
    include /etc/nginx/includes/proxy.conf;
}
location = /openapi.json {
    limit_req zone=api burst=10 nodelay;
    include /etc/nginx/includes/proxy.conf;
}
location /assets/ {
    expires 1y;
    try_files $uri =404;
}
location ~ /\. { deny all; }
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
