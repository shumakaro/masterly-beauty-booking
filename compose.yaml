name: masterly

x-api: &api
  image: masterly-api:${IMAGE_TAG:-local}
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://masterly:${POSTGRES_PASSWORD:?Run scripts/configure_compose.py}@db:5432/masterly
    DATABASE_URL_UNPOOLED: postgresql+psycopg://masterly:${POSTGRES_PASSWORD:?Run scripts/configure_compose.py}@db:5432/masterly
    JWT_SECRET: ${JWT_SECRET:?Run scripts/configure_compose.py}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    CORS_ORIGINS: ${CORS_ORIGINS:?Set the exact public origin}
    AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: masterly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/configure_compose.py}
      MASTERLY_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_compose.py}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/docker/init-db.sh:/docker-entrypoint-initdb.d/10-masterly.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d masterly']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migrate:
    <<: *api
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  web:
    image: masterly-web:${IMAGE_TAG:-local}
    build: ./frontend
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  postgres_data:
