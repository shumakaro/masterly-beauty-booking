name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt --no-deps --disable-pip --format=json --output pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security
          path: pip-audit.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: masterly
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: masterly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masterly -d masterly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://masterly:ci-only-ephemeral@localhost:5432/masterly_test
      DATABASE_URL: postgresql+psycopg://masterly:ci-only-ephemeral@localhost:5432/masterly_test
      DATABASE_URL_UNPOOLED: postgresql+psycopg://masterly:ci-only-ephemeral@localhost:5432/masterly_test
      COOKIE_SECURE: 'false'
      AUTH_RATE_LIMIT: '100'
      CORS_ORIGINS: '["http://127.0.0.1:5173", "http://localhost:5173"]'
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=test-results/pytest.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-verification
          path: backend/test-results/
      - name: Generate ephemeral signing secret
        run: |
          value=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$value"
          echo "JWT_SECRET=$value" >> "$GITHUB_ENV"
          browser_password=$(python -c 'import secrets; print(secrets.token_urlsafe(36))')
          echo "::add-mask::$browser_password"
          echo "BROWSER_TEST_PASSWORD=$browser_password" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Prepare disposable browser catalog
        run: |
          python -m scripts.seed_browser
          python -m app.db.showcase
      - name: Run real browser authentication and catalog against PostgreSQL
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api-ci.log 2>&1 &
          api_pid=$!
          (cd ../frontend && npm run dev -- --host 127.0.0.1 --port 5173 --strictPort) > web-ci.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          cd ../frontend
          npx playwright test
          npx playwright test --config playwright.cross-browser.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-browser-verification
          path: frontend/test-results/
